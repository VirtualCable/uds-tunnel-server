[package]
name = "tunnel-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
shared = { path = "../shared" }

# utilities
anyhow.workspace = true
thiserror.workspace = true

# serialization
serde.workspace = true
base64.workspace = true

# http
reqwest.workspace = true
serde_json.workspace = true

# SSL/TLS
rustls.workspace = true
rustls-native-certs.workspace = true

# toml for config
toml.workspace = true

# Asynchronous runtime
tokio-rustls.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true

# channel
flume.workspace = true

[dev-dependencies]
# Pull in the test-only helpers from `shared` (e.g. the deterministic
# ML-KEM-768 keypair used by the integration tests). Enabling the feature
# here makes it available to this crate's tests without leaking it into
# release builds of `shared`.
shared = { path = "../shared", features = ["test-utils"] }
mockito.workspace = true
serial_test.workspace = true
